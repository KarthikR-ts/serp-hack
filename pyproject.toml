[project]
name = "serpapi-haystack"
version = "0.1.0"
description = "SerpApi × Haystack — Universal Web Intelligence Agent & Integration (Phases 0-6: 14 search verticals + components + tools + universal agent & FastAPI server)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SerpApi-Haystack Contributors" }]
keywords = ["haystack", "serpapi", "search", "agent", "web-intelligence", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "haystack-ai>=2.0.0",
  "requests>=2.31",
  "pydantic>=2.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.20"]
dev = ["pytest>=8", "pytest-cov>=5", "responses>=0.25", "ruff>=0.4", "httpx>=0.24"]
examples = ["haystack-ai>=2.0.0"]

[project.scripts]
serpapi-haystack-server = "serpapi_haystack.server:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serpapi_haystack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
