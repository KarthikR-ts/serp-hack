[project]
name = "serpapi-haystack"
version = "0.1.0"
description = "SerpApi x Haystack — Universal Web Intelligence Agent (Phases 0-3: client + Search/Jobs/Shopping + Haystack tool integration)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SerpApi-Haystack Contributors" }]
keywords = ["haystack", "serpapi", "search", "agent", "web-intelligence"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "haystack-ai>=2.0.0",
  "requests>=2.31",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "responses>=0.25", "ruff>=0.4"]
examples = ["haystack-ai>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serpapi_haystack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
